<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户身份切换 · 浅色</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:      #F4F1EC;
      --bg-card:      #FFFFFF;
      --bg-subtle:    #F8F6F2;
      --border:       #E8E3DA;
      --border-light: #F0EDE7;
      --text-primary: #1C1A17;
      --text-secondary: #7A7060;
      --text-tertiary: #B0A898;
      --shadow-sm: 0 1px 3px rgba(60,50,30,0.06), 0 1px 2px rgba(60,50,30,0.04);
      --shadow-md: 0 4px 16px rgba(60,50,30,0.08), 0 2px 6px rgba(60,50,30,0.05);
      --shadow-lg: 0 12px 40px rgba(60,50,30,0.12), 0 4px 12px rgba(60,50,30,0.06);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #DDD8D0;
      font-family: 'DM Sans', 'PingFang SC', sans-serif;
    }

    .phone-frame {
      width: 375px;
      height: 812px;
      background: var(--bg-page);
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.6),
        0 0 0 2px rgba(0,0,0,0.08),
        0 40px 80px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }

    /* subtle paper texture */
    .phone-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 28px,
          rgba(0,0,0,0.012) 28px,
          rgba(0,0,0,0.012) 29px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px 0;
      position: relative;
      z-index: 1;
    }

    .status-time {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: system-ui, sans-serif;
      letter-spacing: -0.01em;
    }

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    /* Page Content */
    .page-content {
      padding: 0 16px;
      height: calc(100% - 44px - 72px);
      overflow-y: auto;
      scrollbar-width: none;
      position: relative;
      z-index: 1;
    }
    .page-content::-webkit-scrollbar { display: none; }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 20px;
    }

    .header-eyebrow {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      font-style: italic;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .header-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero Card */
    .hero-card {
      border-radius: 22px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Decorative circle rings */
    .hero-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
    }

    .hero-body {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .hero-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .hero-desc {
      font-size: 11.5px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    .hero-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
    }

    .hero-footer {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-pill {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.2);
      letter-spacing: 0.04em;
    }

    .hero-active {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Section Divider */
    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-text {
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      font-weight: 500;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Switch Options */
    .switch-option {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .switch-option::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      opacity: 0;
      transition: opacity 0.2s;
      background: linear-gradient(135deg, rgba(0,0,0,0.015) 0%, transparent 100%);
    }

    .switch-option:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border);
      transform: translateY(-1px);
    }

    .switch-option:hover::after { opacity: 1; }
    .switch-option:active { transform: scale(0.985) translateY(0); box-shadow: var(--shadow-sm); }

    .option-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-meta { flex: 1; }

    .option-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
    }

    .option-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      font-family: 'DM Sans', sans-serif;
    }

    .option-tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .option-desc {
      font-size: 11.5px;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
      font-weight: 300;
    }

    .option-chevron {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Tips */
    .tips-box {
      margin-top: 18px;
      padding: 13px 14px;
      background: var(--bg-card);
      border-radius: 14px;
      border: 1px solid var(--border-light);
      display: flex;
      gap: 9px;
      align-items: flex-start;
      box-shadow: var(--shadow-sm);
    }

    .tips-text {
      font-size: 11px;
      color: var(--text-tertiary);
      line-height: 1.65;
      letter-spacing: 0.01em;
      font-weight: 300;
    }

    /* Bottom Nav */
    .nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding: 10px 0 0;
      z-index: 2;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      opacity: 0.35;
    }
    .nav-item.active { opacity: 1; }

    .nav-label {
      font-size: 10px;
      letter-spacing: 0.03em;
      font-weight: 500;
    }

    .nav-indicator {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      margin-top: 1px;
    }

    /* Confirm Overlay */
    .confirm-overlay {
      position: absolute;
      inset: 0;
      background: rgba(240,237,232,0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 32px;
      animation: fadeIn 0.2s ease;
    }

    .confirm-overlay.visible { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.015); }
      to   { opacity: 1; transform: scale(1); }
    }

    .confirm-card {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: 26px;
      padding: 28px 22px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(60,50,30,0.15), 0 4px 16px rgba(60,50,30,0.08);
    }

    .confirm-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .confirm-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .confirm-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 22px;
      font-weight: 300;
    }

    .btn-confirm {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
      margin-bottom: 9px;
      color: #fff;
    }

    .btn-confirm:hover { opacity: 0.88; }
    .btn-confirm:active { transform: scale(0.98); }

    .btn-cancel {
      width: 100%;
      padding: 13px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-cancel:hover { background: var(--border-light); color: var(--text-primary); }

    /* Switch animation */
    @keyframes cardSwitch {
      0%   { opacity: 0.4; transform: scale(0.97) translateY(6px); }
      100% { opacity: 1;   transform: scale(1)    translateY(0); }
    }
    .switch-anim {
      animation: cardSwitch 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Staggered entrance */
    @keyframes enterUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .enter { animation: enterUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }
    .enter-1 { animation-delay: 0.05s; }
    .enter-2 { animation-delay: 0.12s; }
    .enter-3 { animation-delay: 0.19s; }
    .enter-4 { animation-delay: 0.26s; }
    .enter-5 { animation-delay: 0.33s; }
  </style>
</head>
<body>

<div class="phone-frame">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <div style="display:flex;gap:2px;align-items:flex-end;">
        <div style="width:3px;height:7px;border-radius:2px;background:var(--text-primary);"></div>
        <div style="width:3px;height:10px;border-radius:2px;background:var(--text-primary);"></div>
        <div style="width:3px;height:13px;border-radius:2px;background:var(--border);"></div>
      </div>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="margin-left:2px;">
        <path d="M0 4C3.6-1.3 12.4-1.3 16 4" stroke="#1C1A17" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
        <path d="M2.4 6.2C5-0.7 11-0.7 13.6 6.2" stroke="#1C1A17" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <path d="M4.8 8.4C6.4 5.6 9.6 5.6 11.2 8.4" stroke="#1C1A17" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="8" cy="11" r="1.2" fill="#1C1A17"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none" style="margin-left:2px;">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1C1A17" stroke-opacity="0.2"/>
        <rect x="2" y="2" width="17" height="8" rx="2" fill="#1C1A17"/>
        <path d="M23 4v4a2 2 0 000-4z" fill="#1C1A17" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Page Content -->
  <div class="page-content">

    <!-- Header -->
    <div class="page-header enter enter-1">
      <div>
        <div class="header-eyebrow">Identity Profile</div>
        <h1 class="header-title">身份切换</h1>
      </div>
      <div class="header-avatar">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <circle cx="8.5" cy="6.5" r="3" stroke="#B0A898" stroke-width="1.4"/>
          <path d="M2 15c0-3.59 2.91-6.5 6.5-6.5S15 11.41 15 15" stroke="#B0A898" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Hero Card -->
    <div class="hero-card enter enter-2" id="heroCard">
      <!-- Decorative rings -->
      <div class="hero-ring" id="ring1" style="width:160px;height:160px;right:-40px;top:-40px;"></div>
      <div class="hero-ring" id="ring2" style="width:100px;height:100px;right:-10px;top:-10px;opacity:0.1;"></div>

      <div class="hero-badge">
        <span id="heroPulse" style="width:6px;height:6px;border-radius:50%;display:inline-block;background:rgba(255,255,255,0.9);box-shadow:0 0 0 2px rgba(255,255,255,0.3);"></span>
        当前身份
      </div>

      <div class="hero-body">
        <div>
          <div class="hero-name" id="heroName">理财经理</div>
          <div class="hero-desc" id="heroDesc">管理客户资产 · 提供投资建议</div>
        </div>
        <div class="hero-icon-box" id="heroIconBox">
          <div id="heroIcon" style="display:flex;align-items:center;justify-content:center;">
            <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
              <circle cx="14" cy="9" r="5" stroke="rgba(255,255,255,0.9)" stroke-width="1.8"/>
              <path d="M4 24c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M18 13l2 2 4-4" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="hero-footer">
        <div class="hero-pill" id="heroTag">专业版</div>
        <div class="hero-active">
          <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
            <circle cx="4" cy="4" r="3" fill="rgba(255,255,255,0.5)"/>
          </svg>
          已激活
        </div>
      </div>
    </div>

    <!-- Section Label -->
    <div class="section-label enter enter-3">
      <span class="section-text">切换至</span>
      <div class="section-line"></div>
    </div>

    <!-- Options -->
    <div id="optionsContainer"></div>

    <!-- Tips -->
    <div class="tips-box enter enter-5">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;margin-top:1px;">
        <circle cx="7" cy="7" r="6" stroke="var(--border)" stroke-width="1.2"/>
        <path d="M7 6v4M7 4.5v.5" stroke="var(--text-tertiary)" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <p class="tips-text">切换身份后，您的操作权限与数据视图将同步更新。切换过程中请勿关闭应用。</p>
    </div>

    <div style="height:90px;"></div>
  </div>

  <!-- Bottom Nav -->
  <div class="nav-bar">
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 9.5L11 3l8 6.5V19a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="var(--text-tertiary)" stroke-width="1.5"/>
        <path d="M8 20v-8h6v8" stroke="var(--text-tertiary)" stroke-width="1.5"/>
      </svg>
      <span class="nav-label" style="color:var(--text-tertiary);">首页</span>
    </div>
    <div class="nav-item active" id="navActive">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" id="navIcon">
        <circle cx="11" cy="8" r="4" stroke="#8B6F3E" stroke-width="1.5"/>
        <path d="M3 20c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="#8B6F3E" stroke-width="1.5" stroke-linecap="round"/>

      <div class="nav-indicator" id="navDot" style="background:#8B6F3E;"></div>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M4 4h14a1 1 0 011 1v9a1 1 0 01-1 1H7l-4 3V5a1 1 0 011-1z" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linejoin="round"/>

    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="3" stroke="var(--text-tertiary)" stroke-width="1.5"/>
        <path d="M11 2v2M11 18v2M2 11h2M18 11h2M4.22 4.22l1.42 1.42M16.36 16.36l1.42 1.42M4.22 17.78l1.42-1.42M16.36 5.64l1.42-1.42" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>

    </div>
  </div>

  <!-- Confirm Overlay -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-card">
      <div class="confirm-icon" id="confirmIcon"></div>
      <div class="confirm-title">确认切换身份</div>
      <div class="confirm-desc" id="confirmDesc"></div>
      <button class="btn-confirm" id="confirmBtn" onclick="doSwitch()">确认切换</button>
      <button class="btn-cancel" onclick="cancelSwitch()">取消</button>
    </div>
  </div>

</div>

<script>
  const identities = {
    manager: {
      id: "manager",
      label: "理财经理",
      tag: "专业版",
      desc: "管理客户资产 · 提供投资建议",
      /* Warm amber-brown gradient */
      gradient: "linear-gradient(135deg, #8B6F3E 0%, #A07840 40%, #7A5F30 100%)",
      accent: "#8B6F3E",
      accentLight: "#F5EDD8",
      accentMid: "#D4AA6A",
      navColor: "#8B6F3E",
      iconSvg: `<svg width="26" height="26" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="9" r="5" stroke="rgba(255,255,255,0.9)" stroke-width="1.8"/>
        <path d="M4 24c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 13l2 2 4-4" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`,
      optionIconSvg: `<svg width="26" height="26" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="9" r="5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 24c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 13l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`
    },
    institution: {
      id: "institution",
      label: "机构客户",
      tag: "企业版",
      desc: "机构账户管理 · 批量资产配置",
      gradient: "linear-gradient(135deg, #2C5282 0%, #3A6EA5 40%, #1E3D6E 100%)",
      accent: "#2C5282",
      accentLight: "#E8F0FA",
      accentMid: "#5B8EC4",
      navColor: "#2C5282",
      iconSvg: `<svg width="26" height="26" viewBox="0 0 28 28" fill="none">
        <rect x="3" y="12" width="22" height="14" rx="1.5" stroke="rgba(255,255,255,0.9)" stroke-width="1.8"/>
        <path d="M9 12V9a5 5 0 0110 0v3" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 18h10M9 22h6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
      </svg>`,
      optionIconSvg: `<svg width="26" height="26" viewBox="0 0 28 28" fill="none">
        <rect x="3" y="12" width="22" height="14" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M9 12V9a5 5 0 0110 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 18h10M9 22h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>`
    },
    personal: {
      id: "personal",
      label: "个人客户",
      tag: "个人版",
      desc: "个人财富规划 · 智能投资组合",
      gradient: "linear-gradient(135deg, #276150 0%, #358068 40%, #1E4E40 100%)",
      accent: "#276150",
      accentLight: "#E4F2ED",
      accentMid: "#4A9880",
      navColor: "#276150",
      iconSvg: `<svg width="26" height="26" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="10" r="5" stroke="rgba(255,255,255,0.9)" stroke-width="1.8"/>
        <path d="M5 24c0-4.97 4.03-9 9-9s9 4.03 9 9" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 20l1.5 1.5L22 18" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`,
      optionIconSvg: `<svg width="26" height="26" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="10" r="5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M5 24c0-4.97 4.03-9 9-9s9 4.03 9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 20l1.5 1.5L22 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`
    }
  };

  let current = "manager";
  let confirmTarget = null;

  function updateHero(id) {
    const identity = identities[id];
    const card = document.getElementById("heroCard");
    card.style.background = identity.gradient;
    card.classList.remove("switch-anim");
    void card.offsetWidth;
    card.classList.add("switch-anim");

    document.getElementById("heroName").textContent = identity.label;
    document.getElementById("heroDesc").textContent = identity.desc;
    document.getElementById("heroTag").textContent = identity.tag;
    document.getElementById("heroIcon").innerHTML = identity.iconSvg;

    // Update nav
    document.getElementById("navLabel").style.color = identity.navColor;
    document.getElementById("navDot").style.background = identity.navColor;
    document.querySelectorAll('#navActive svg circle, #navActive svg path').forEach(el => {
      el.setAttribute('stroke', identity.navColor);
    });
  }

  function renderOptions() {
    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";
    Object.values(identities)
      .filter(i => i.id !== current)
      .forEach((identity, idx) => {
        const el = document.createElement("div");
        el.className = `switch-option enter enter-${idx + 4}`;
        el.innerHTML = `
          <div class="option-icon-wrap"
            style="background:${identity.accentLight}; color:${identity.accent};">
            ${identity.optionIconSvg}
          </div>
          <div class="option-meta">
            <div class="option-header">
              <span class="option-name">${identity.label}</span>
              <span class="option-tag"
                style="background:${identity.accentLight}; color:${identity.accent};">
                ${identity.tag}
              </span>
            </div>
            <div class="option-desc">${identity.desc}</div>
          </div>
          <div class="option-chevron">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M3.5 2L6.5 5L3.5 8" stroke="var(--text-tertiary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        `;
        el.addEventListener("click", () => openConfirm(identity.id));
        container.appendChild(el);
      });
  }

  function openConfirm(targetId) {
    confirmTarget = targetId;
    const from = identities[current];
    const to   = identities[targetId];

    const icon = document.getElementById("confirmIcon");
    icon.style.background = to.accentLight;
    icon.style.color = to.accent;
    icon.innerHTML = to.optionIconSvg.replace(/currentColor/g, to.accent);

    document.getElementById("confirmDesc").innerHTML =
      `您将从 <span style="color:${from.accent};font-weight:500;">${from.label}</span> 切换至 <span style="color:${to.accent};font-weight:500;">${to.label}</span>`;

    document.getElementById("confirmBtn").style.background = to.gradient;

    const overlay = document.getElementById("confirmOverlay");
    overlay.classList.add("visible");
  }

  function cancelSwitch() {
    document.getElementById("confirmOverlay").classList.remove("visible");
    confirmTarget = null;
  }

  function doSwitch() {
    document.getElementById("confirmOverlay").classList.remove("visible");
    if (!confirmTarget) return;
    current = confirmTarget;
    confirmTarget = null;
    updateHero(current);
    renderOptions();
  }

  // Init
  updateHero(current);
  renderOptions();
</script>
</body>
</html>
